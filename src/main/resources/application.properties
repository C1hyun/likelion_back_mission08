spring.application.name=pbl

# ── MySQL 연결 ──────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/likelion_pbl?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=      # 본인 MySQL 비밀번호로 변경
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────
# 시작 시 테이블을 DROP 후 CREATE (개발용)
spring.jpa.hibernate.ddl-auto=create
# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true
# SQL을 보기 좋게 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# MySQL 방언
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
